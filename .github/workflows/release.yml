name: Build and Release App

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform-name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x64
          - platform-name: windows-x64
            runner: windows-latest
            os: windows

          # 2. Linux x64
          - platform-name: linux-x64
            runner: ubuntu-latest
            os: linux

          # 3. macOS Intel (x64)
          - platform-name: macos-intel-x64
            runner: macos-13
            os: macos

          # 4. macOS Apple Silicon (ARM64)
          - platform-name: macos-arm64
            runner: macos-latest
            os: macos

    # Only run if PR was MERGED from 'dev' branch
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Extract __version__ from raw_converter.py (Works across all OS runners via bash)
      - name: Extract App Version
        id: get_version
        shell: bash
        run: |
          VER=$(python -c "import re; m = re.search(r'__version__\s*=\s*[\"']([^\"']+)[\"']', open('raw_converter.py').read()); print(m.group(1) if m else '1.0.0')")
          echo "VERSION=v${VER}" >> $GITHUB_OUTPUT
          echo "Extracted Version: v${VER}"

      # Linux headless runners need display/GUI libraries for Tkinter/rawpy
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 python3-tk zip

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Build Windows Executable
      - name: Build Windows (.exe)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name raw-converter raw_converter.py
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist\raw-converter.exe -Destination release\
          Compress-Archive -Path release\* -DestinationPath raw-converter-${{ matrix.platform-name }}.zip -Force

      # Build Linux Executable
      - name: Build Linux (Binary)
        if: matrix.os == 'linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name raw-converter raw_converter.py
          mkdir -p release
          mv dist/raw-converter release/
          zip -r raw-converter-${{ matrix.platform-name }}.zip release

      # Build macOS Application (.app bundle)
      - name: Build macOS (.app Bundle)
        if: matrix.os == 'macos'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name raw-converter raw_converter.py
          cd dist
          zip -r ../raw-converter-${{ matrix.platform-name }}.zip raw-converter.app

      # Attach zipped binaries to the GitHub Release tagged with your version
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            Automated release generated from PR #${{ github.event.pull_request.number }} (`dev` ➔ `main`).
          draft: false
          prerelease: false
          files: raw-converter-${{ matrix.platform-name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}