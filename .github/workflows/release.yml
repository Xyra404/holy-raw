name: Build and Release App

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  # JOB 1: Build binaries across all 4 OS platforms in parallel
  build:
    name: Build (${{ matrix.platform-name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x64
          - platform-name: windows-x64
            runner: windows-latest
            os: windows

          # 2. Linux x64
          - platform-name: linux-x64
            runner: ubuntu-latest
            os: linux

          # 3. macOS Intel (x64)
          - platform-name: macos-intel-x64
            runner: macos-13
            os: macos

          # 4. macOS Apple Silicon (ARM64)
          - platform-name: macos-arm64
            runner: macos-latest
            os: macos

    # Only run if PR was MERGED from 'dev' branch
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Linux headless runners need display/GUI libraries for Tkinter/rawpy
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 python3-tk zip

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Build Windows Executable
      - name: Build Windows (.exe)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name raw-converter raw_converter.py
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist\raw-converter.exe -Destination release\
          Compress-Archive -Path release\* -DestinationPath raw-converter-${{ matrix.platform-name }}.zip -Force

      # Build Linux Executable
      - name: Build Linux (Binary)
        if: matrix.os == 'linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name raw-converter raw_converter.py
          mkdir -p release
          mv dist/raw-converter release/
          zip -r raw-converter-${{ matrix.platform-name }}.zip release

      # Build macOS Application (.app bundle)
      - name: Build macOS (.app Bundle)
        if: matrix.os == 'macos'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name raw-converter raw_converter.py
          cd dist
          zip -r ../raw-converter-${{ matrix.platform-name }}.zip raw-converter.app

      # Upload zipped binary as a temporary build artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-converter-${{ matrix.platform-name }}
          path: raw-converter-${{ matrix.platform-name }}.zip

  # JOB 2: Collect all built zips and publish a single GitHub Release
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Extract __version__ safely using Python strip()
      - name: Extract App Version
        id: get_version
        shell: bash
        run: |
          python -c "
          import os
          ver = '1.0.0'
          for line in open('raw_converter.py'):
              if '__version__' in line:
                  ver = line.split('=')[1].strip(' \"\'\n\r')
                  break
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'VERSION=v{ver}\n')
          print(f'Extracted Version: v{ver}')
          "

      # Download all 4 build artifacts from Job 1
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: raw-converter-*
          merge-multiple: true

      # Publish all 4 files to GitHub Releases at once
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            Automated release generated from PR #${{ github.event.pull_request.number }} (`dev` ➔ `main`).
          draft: false
          prerelease: false
          files: release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}